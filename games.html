<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaming Library | BANRI Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=20260811a" />
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/banri-theme.js?v=20260807h" defer></script>
  </head>
  <body class="banri-theme library-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="banri-noise" aria-hidden="true"></div>
    <div w3-include-html="nav.html"></div>

    <main id="main-content" class="library-main">
      <section class="library-hero">
        <div class="container-fluid px-3 px-lg-5">
          <div class="row g-4 align-items-end">
            <div class="col-12 col-lg-6">
              <p class="eyebrow-line">Gaming Library</p>
              <h1 class="library-title">
                Gaming
                <span>Library</span>
              </h1>
              <p class="library-copy">
                A collection of worlds, battles, tools, trackers, and adventures.
              </p>
            </div>
            <div class="col-12 col-lg-6">
              <div class="row g-3 library-stats" aria-label="Library statistics">
                <div class="col-12 col-sm-4">
                  <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">01</span>
                    <strong id="stat-total-games">0</strong>
                    <small>Games in library</small>
                  </article>
                </div>
                <div class="col-12 col-sm-4">
                  <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">02</span>
                    <strong id="stat-active-games">0</strong>
                    <small>Active rotation</small>
                  </article>
                </div>
                <div class="col-12 col-sm-4">
                  <article class="stat-card">
                    <span class="stat-icon" aria-hidden="true">03</span>
                    <strong id="stat-completion">0%</strong>
                    <small>Avg completion</small>
                  </article>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="banri-section pt-0">
        <div class="container-fluid px-3 px-lg-5">
          <div class="library-layout">
            <aside class="library-sidebar" aria-label="Game library filters">
              <div class="filter-panel">
                <div class="panel-title"><span></span> Categories</div>
                <div id="category-filter-list" class="filter-list"></div>
              </div>
              <div class="filter-panel">
                <div class="panel-title"><span></span> Status</div>
                <div id="status-filter-list" class="filter-list"></div>
              </div>
              <figure class="library-quote">
                <blockquote id="libraryQuoteText">
                  It is not about the games you play. It is about the worlds you remember.
                </blockquote>
                <figcaption id="libraryQuoteAuthor">- Banri</figcaption>
              </figure>
            </aside>

            <section class="library-console" aria-labelledby="library-grid-title">
              <div class="library-toolbar">
                <label class="visually-hidden" for="library-search">Search games</label>
                <div class="search-control">
                  <input id="library-search" type="search" placeholder="Search games..." autocomplete="off" />
                  <span aria-hidden="true"></span>
                </div>

                <label class="visually-hidden" for="status-select">Status</label>
                <select id="status-select" class="banri-select" aria-label="Filter by status">
                  <option value="all">All status</option>
                </select>

                <label class="visually-hidden" for="genre-select">Genre</label>
                <select id="genre-select" class="banri-select" aria-label="Filter by genre">
                  <option value="all">All genres</option>
                </select>

                <label class="visually-hidden" for="sort-select">Sort by</label>
                <select id="sort-select" class="banri-select" aria-label="Sort games">
                  <option value="recent">Recently played</option>
                  <option value="title">Title</option>
                  <option value="hours">Hours played</option>
                  <option value="completion">Completion</option>
                </select>
              </div>

              <div class="section-heading compact-heading">
                <p><span>//</span> Archive</p>
                <h2 id="library-grid-title">All Games</h2>
                <a id="library-count" href="#library-grid-title">0 Results</a>
              </div>

              <div id="gameCardsContainer" class="library-card-grid" aria-live="polite"></div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer class="banri-footer compact-footer">
      <div class="container-fluid px-3 px-lg-5">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
          <p class="footer-kicker mb-0">Games / Tools / Worlds</p>
          <small>&copy; 2026 Banri Gaming. All rights reserved.</small>
        </div>
      </div>
    </footer>

    <script>
      includeHTML();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/gamelib.js?v=20260811a"></script>
  </body>
</html>

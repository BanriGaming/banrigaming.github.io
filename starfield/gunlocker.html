<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="banri-theme legacy-theme starfield-tool-page">
    <div class="banri-noise" aria-hidden="true"></div>
    <div w3-include-html="../nav.html"></div>

    <main class="tool-page-shell">
      <section class="jumbotron jumbotron-fluid tool-hero starfield-hero">
        <p class="eyebrow-line">Starfield Archive</p>
        <h1 class="display-4">Gun Locker</h1>
        <p class="lead">Track Starfield weapons by class, search your armory, and mark collected gear locally.</p>
      </section>

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="/games.html">Game Library</a></li>
          <li class="breadcrumb-item"><a href="/landing-pages/starfield.html">Starfield</a></li>
          <li class="breadcrumb-item active" aria-current="page">Gun Locker</li>
        </ol>
      </nav>

      <section class="tool-console panel-frame">
        <div class="section-heading compact-heading">
          <p><span>//</span> Weapon Filter</p>
          <h2>Armory Inventory</h2>
        </div>
        <div class="filter-buttons starfield-filter-buttons">
          <button id="all">All</button>
          <button id="Melee">Melee</button>
          <button id="Pistols">Pistols</button>
          <button id="Rifles">Rifles</button>
          <button id="Shotguns">Shotguns</button>
          <button id="Laser Pistols">Laser Pistols</button>
          <button id="Laser Rifles">Laser Rifles</button>
          <button id="Heavy Weapons">Heavy Weapons</button>
          <button id="Particle Beam Pistols">Particle Beam Pistols</button>

          <button id="Electromagnetic Pistols">Electromagnetic Pistols</button>
          <button id="Electromagnetic Rifles">Electromagnetic Rifles</button>
          <button id="Uniques">Uniques</button>
        </div>
        <div class="search-bar-container">
          <input type="text" id="search-input" class="search-bar" placeholder="Search for a weapon..." />
        </div>
        <div class="weapon-list starfield-checklist-grid" id="weapon-list"></div>
      </section>
    </main>

    <script src="../assets/js/sfweapons.js"></script>

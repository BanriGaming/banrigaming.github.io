<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planetary Resource Archive | BANRI Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css?v=20260807i" />
    <script src="../assets/js/nav.js"></script>
    <script src="../assets/js/banri-theme.js?v=20260807i" defer></script>
  </head>
  <body class="banri-theme legacy-theme starfield-tool-page starfield-starchart-page">
    <div class="banri-noise" aria-hidden="true"></div>
    <div w3-include-html="../nav.html"></div>

    <main class="tool-page-shell">
      <section class="jumbotron jumbotron-fluid tool-hero starfield-hero">
        <p class="eyebrow-line">Starfield Archive</p>
        <h1 class="display-4">Planetary Resource Archive</h1>
        <p class="lead">
          Search star systems, scan planets, and filter resources through a cleaner encrypted archive shell.
        </p>
      </section>

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="/games.html">Game Library</a></li>
          <li class="breadcrumb-item"><a href="/landing-pages/starfield.html">Starfield</a></li>
          <li class="breadcrumb-item active" aria-current="page">Planetary Resource Archive</li>
        </ol>
      </nav>

      <section class="tool-console panel-frame">
        <div class="section-heading compact-heading">
          <p><span>//</span> Resource Matrix</p>
          <h2>Filter Resources</h2>
          <div class="d-flex flex-wrap gap-2 ms-lg-auto">
            <button id="clear-resource-filters" class="btn btn-banri-outline btn-sm" type="button">Clear Filters</button>
            <button class="btn btn-banri-outline btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">Star Map</button>
          </div>
        </div>

        <div class="accordion mb-4" id="starAccordion">
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingOne">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                Open Star Map
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#starAccordion">
              <div class="accordion-body text-center">
                <a href="../assets/img/starfield/Starfield-Map.webp">
                  <img class="img-fluid" alt="Starfield Galaxy Map" src="../assets/img/starfield/Starfield-Map.webp" width="1920" height="1213" loading="lazy" decoding="async" />
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="resource-buttons filter-buttons starfield-resource-buttons">
          <button id="filter-None">None</button>
          <button id="filter-Ad">Aldumite</button>
          <button id="filter-HnCn">Alkanes</button>
          <button id="filter-Al">Aluminum</button>
          <button id="filter-Sb">Antimony</button>
          <button id="filter-Ar">Argon</button>
          <button id="filter-C6Hn">Benzene</button>
          <button id="filter-Be">Beryllium</button>
          <button id="filter-Cs">Caesium</button>
          <button id="filter-R-COOH">Carboxylic Acids</button>
          <button id="filter-Cl">Chlorine</button>
          <button id="filter-SiH3Cl">Chlorosilanes</button>
          <button id="filter-Co">Cobalt</button>
          <button id="filter-Cu">Copper</button>
          <button id="filter-Dy">Dysprosium</button>
          <button id="filter-Eu">Europium</button>
          <button id="filter-F">Fluorine</button>
          <button id="filter-Au">Gold</button>
          <button id="filter-He-3">Helium</button>
          <button id="filter-Ie">Indicite</button>
          <button id="filter-IL">Ionic Liquids</button>
          <button id="filter-Ir">Iridium</button>
          <button id="filter-Fe">Iron</button>
          <button id="filter-Pb">Lead</button>
          <button id="filter-Li">Lithium</button>
          <button id="filter-Hg">Mercury</button>
          <button id="filter-Nd">Neodymium</button>
          <button id="filter-Ne">Neon</button>
          <button id="filter-Ni">Nickel</button>
          <button id="filter-Pd">Palladium</button>
          <button id="filter-Pt">Platinum</button>
          <button id="filter-Pu">Plutonium</button>
          <button id="filter-Rc">Rothicite</button>
          <button id="filter-Ag">Silver</button>
          <button id="filter-Ta">Tantalum</button>
          <button id="filter-Tsn">Tasine</button>
          <button id="filter-xF4">Tetrafluorides</button>
          <button id="filter-Ti">Titanium</button>
          <button id="filter-W">Tungsten</button>
          <button id="filter-U">Uranium</button>
          <button id="filter-V">Vanadium</button>
          <button id="filter-Vr">Veryl</button>
          <button id="filter-Vy">Vytinium</button>
          <button id="filter-H20">Water</button>
          <button id="filter-Xe">Xenon</button>
          <button id="filter-Yb">Ytterbium</button>
        </div>

        <div class="selected-filters my-3" id="s-filters">Selected Filters:</div>

        <div class="starfield-search-panel">
          <div class="search-mode-group" aria-label="Search mode">
            <label class="form-check">
              <input class="form-check-input" type="radio" name="search-type" id="search-star-system" checked />
              <span class="form-check-label">Star System</span>
            </label>
            <label class="form-check">
              <input class="form-check-input" type="radio" name="search-type" id="search-planet" />
              <span class="form-check-label">Planet</span>
            </label>
          </div>

          <input type="text" id="search-input" class="form-control planet-bar-container planet-bar" placeholder="Search for a planet or star system" />

          <div class="display-count">
            Displayed Planets: <span id="d-planets"></span>
          </div>
        </div>
      </section>

      <section class="starfield-results-shell">
        <div class="card-container"></div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="../assets/js/starchart.js?v=20260807i"></script>
    <script>
      includeHTML();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clips | BANRI Gaming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=20260807h" />
    <link rel="stylesheet" href="clips.css?v=20260807h" />
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/banri-theme.js?v=20260807h" defer></script>
  </head>
  <body class="banri-theme clips-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="banri-noise" aria-hidden="true"></div>
    <div w3-include-html="nav.html"></div>

    <main id="main-content">
      <section class="subpage-hero clips-hero">
        <div class="container-fluid px-3 px-lg-5">
          <div class="row g-4 align-items-end">
            <div class="col-12 col-lg-7">
              <p class="eyebrow-line">Medal Vault</p>
              <h1 class="subpage-title">
                Clips
                <span>Archive</span>
              </h1>
              <p class="subpage-copy">
                Captured runs, bad decisions, close calls, and the little sparks that make a session worth saving.
              </p>
            </div>
            <div class="col-12 col-lg-5">
              <div class="clips-status-panel">
                <strong id="clip-count">--</strong>
                <span>clips indexed</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="banri-section pt-0">
        <div class="container-fluid px-3 px-lg-5">
          <div id="game-navigation" class="clip-filter-strip" aria-label="Clip game filters"></div>
          <div id="clips-gallery" aria-live="polite">
            <div class="clip-loading">Loading clips...</div>
          </div>
        </div>
      </section>
    </main>

    <div id="clip-modal" class="clip-modal" aria-hidden="true">
      <div class="clip-modal-backdrop"></div>
      <div class="clip-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="clip-modal-title">
        <button id="clip-modal-close" class="clip-modal-close" type="button" aria-label="Close video">x</button>
        <div id="clip-modal-player"></div>
        <div class="clip-modal-info">
          <div id="clip-modal-game" class="clip-game"></div>
          <h2 id="clip-modal-title"></h2>
          <a id="clip-modal-link" href="#" target="_blank" rel="noopener" class="clip-link">
            Watch on Medal <span aria-hidden="true">-&gt;</span>
          </a>
        </div>
      </div>
    </div>

    <footer class="banri-footer compact-footer">
      <div class="container-fluid px-3 px-lg-5">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
          <p class="footer-kicker mb-0">Medal / Moments / Vault</p>
          <small>&copy; 2026 Banri Gaming. All rights reserved.</small>
        </div>
      </div>
    </footer>

    <script>
      includeHTML();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="clips.js?v=20260807h"></script>
  </body>
</html>
